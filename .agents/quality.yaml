schema_version: "1.0"
policy_id: profile-delegate-quality
minimum_quality_expected: standard
change_scope: {default: all, include_untracked: true, detect_file_renames: true}
scope:
  include: []
  exclude: ["**/vendor/**", "**/generated/**", "**/dist/**", "**/coverage/**"]
  languages: []
baseline: {strategy: merge_base, ref: e46c84910ea00e0f4b8795cd2bfcc35378ce1cee, unavailable: error}
adapters:
  - {id: core-source, type: builtin, implementation: core_source_v1, languages: [], required_at: soft}
  - {id: python-ast, type: builtin, implementation: python_ast_v1, languages: [python], required_at: standard}
thresholds:
  python_ast_v1.function_logical_lines: {warning: 40, strong: 80}
  python_ast_v1.cyclomatic_v1: {warning: 10, strong: 15}
  python_ast_v1.max_nesting: {warning: 4, strong: 6}
  python_ast_v1.parameter_count: {warning: 5, strong: 8}
  python_ast_v1.file_logical_lines: {warning: 500, strong: 900}
policy:
  changed_code_only: true
  untouched_existing_debt: report
  soft_new_strong: report
  standard_new_strong: exception_or_fail
  top_new_strong: exception_or_fail
  required_adapter_failure: incomplete
exceptions:
  - id: managed-scope-regression-file-size
    selector: {path: tests/test_profile_delegate.py, language: python, symbol: "<module>", kind: file}
    metric: python_ast_v1.file_logical_lines
    allowance: {maximum: 1965}
    rationale: Necessary host-independent security regression adds five logical lines to existing module debt; restructuring would expand this repair.
    approval: {authority: "independent reviewer pd_20261004_130056_th1z6j", reference: docs/reviews/2026-10-04-managed-scope.md}
    created_at: "2026-10-04"
    expires_at: "2026-11-03"
extensions: {}
