name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: "0.11.6"
          enable-cache: true
      - name: Verify dependency lock
        run: uv lock --check
      - name: Install locked test dependencies
        run: uv sync --frozen --python "${{ matrix.python-version }}"
      - name: Lint
        run: uv run --frozen ruff check .
      - name: Compile Python files
        run: >-
          uv run --frozen python -m py_compile
          __init__.py child_bootstrap.py cli.py cli_smoke.py core.py
          execution.py native.py native_approval.py contracts.py
          event_journal.py spectator.py tui_rpc.py tui_runner.py
          scripts/validate_release.py
          tests/*.py
      - name: Validate plugin registration and release metadata
        run: uv run --frozen python scripts/validate_release.py
      - name: Run tests
        run: |
          uv run --frozen python -m pytest . -m 'not integration' -q -o 'addopts=' -W error \
            --junitxml=pytest-results.xml 2>&1 | tee pytest-output.log
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            {
              echo '## Pytest failure output'
              echo '```text'
              cat pytest-output.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$code"
      - name: Upload pytest diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pytest-${{ matrix.python-version }}
          path: |
            pytest-output.log
            pytest-results.xml
      - name: Secret pattern scan
        run: uv run --frozen python scripts/scan_secrets.py

  installed-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PROFILE_DELEGATE_TEST_RUNTIME: ${{ github.workspace }}/../hermes-runtime
      PYTHONPATH: ${{ github.workspace }}/../hermes-runtime
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: NousResearch/hermes-agent
          ref: e8c97320ac8691d4de92af49f98459f9ef9ddb08
          path: hermes-runtime-source
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          version: "0.11.6"
      - name: Provision pinned native runtime (Python 3.14 runtime contract)
        run: |
          mv hermes-runtime-source "$PROFILE_DELEGATE_TEST_RUNTIME"
          uv sync --frozen --group dev --python 3.14 --project "$PROFILE_DELEGATE_TEST_RUNTIME"
          uv pip install --python "$PROFILE_DELEGATE_TEST_RUNTIME/.venv/bin/python" --require-hashes --only-binary :all: -r scripts/native-test-tooling.txt
      - name: Verify native interpreter and real dependency closure
        run: '"$PROFILE_DELEGATE_TEST_RUNTIME/.venv/bin/python" scripts/native_prerequisite.py'
      - name: Native integration (missing prerequisite fails, no skips)
        run: '"$PROFILE_DELEGATE_TEST_RUNTIME/.venv/bin/python" -m pytest -m integration -q -o "addopts=" -W error'
