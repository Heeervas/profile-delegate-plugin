name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: "0.11.6"
          enable-cache: true
      - name: Verify dependency lock
        run: uv lock --check
      - name: Install locked test dependencies
        run: uv sync --frozen --python "${{ matrix.python-version }}"
      - name: Lint
        run: uv run --frozen ruff check .
      - name: Compile Python files
        run: >-
          uv run --frozen python -m py_compile
          __init__.py child_bootstrap.py cli.py cli_smoke.py core.py
          event_journal.py event_schema.py spectator.py tui_rpc.py tui_runner.py
          scripts/validate_release.py
          test_event_journal.py test_profile_delegate.py test_reliability_reset.py
          test_spectator.py test_tui_rpc.py
      - name: Validate plugin registration and release metadata
        run: uv run --frozen python scripts/validate_release.py
      - name: Run tests
        run: |
          uv run --frozen python -m pytest . -q -o 'addopts=' -W error \
            --junitxml=pytest-results.xml 2>&1 | tee pytest-output.log
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            {
              echo '## Pytest failure output'
              echo '```text'
              cat pytest-output.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$code"
      - name: Upload pytest diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pytest-${{ matrix.python-version }}
          path: |
            pytest-output.log
            pytest-results.xml
      - name: Secret pattern scan
        run: |
          python - <<'PY'
          import os, re, sys
          patterns=[r'github_pat_[A-Za-z0-9_]+', r'ghp_[A-Za-z0-9]{20,}', r'sk-[A-Za-z0-9]{20,}', r'AKIA[0-9A-Z]{16}', r'BEGIN (?:RSA|OPENSSH|EC|DSA)? ?PRIVATE KEY']
          hits=[]
          for dp, dns, fns in os.walk('.'):
              dns[:] = [d for d in dns if d not in {'.git','__pycache__','.pytest_cache'}]
              for fn in fns:
                  p=os.path.join(dp, fn)
                  try: data=open(p,'rb').read()
                  except Exception: continue
                  if b'\0' in data[:4096]: continue
                  text=data.decode('utf-8','ignore')
                  if any(re.search(x,text) for x in patterns): hits.append(p)
          print('secret_hits=', len(hits))
          for h in hits: print(h)
          sys.exit(1 if hits else 0)
          PY
