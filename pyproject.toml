[project]
name = "profile-delegate"
version = "1.10.0"
requires-python = ">=3.11,<3.14"
dependencies = []

[tool.ruff]
target-version = "py311"
line-length = 140

[tool.ruff.lint]
select = ["E", "F"]
ignore = ["E402", "E501"]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pyyaml==6.0.3",
    "ruff==0.15.10",
]
